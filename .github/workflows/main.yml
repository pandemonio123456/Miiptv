name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Descomprimir y compilar
        run: |
          mkdir proyecto
          unzip -q "$(ls MiIPTV*.zip | sort -V | tail -n 1)" -d proyecto
          cd "$(dirname "$(find proyecto -name settings.gradle.kts | head -n 1)")"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/salida"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/salida/"
      - uses: actions/upload-artifact@v4
        with:
          name: MiIPTV-apk
          path: salida/app-debug.apk
